<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Digital Business Card</title>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="preload" href="styles/main.css" as="style">
  <link rel="preload" href="assets/owner.webp" as="image" type="image/webp">
  <link rel="stylesheet" href="styles/main.css">

  <meta name="description" content="Digital business card">
  <meta name="author" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="">
  <meta name="twitter:description" content="">
  <meta name="twitter:image" content="">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="mask-icon" href="assets/favicon.svg" color="#F4A32D">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#F4A32D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alex Martinez">
</head>
<body>
  <a class="skip-link" href="#main-content" id="skip-link">Skip to main content</a>

  <main id="main-content" class="card" role="main" aria-label="Digital Business Card">
    <div id="card-root" class="card__root"></div>
  </main>

  <div class="modal qr-modal" id="qr-modal" role="dialog" aria-modal="true" aria-labelledby="qr-modal-title" aria-hidden="true">
    <div class="modal__backdrop" tabindex="-1" aria-hidden="true"></div>
    <div class="modal__content">
      <div class="modal__header">
        <h3 id="qr-modal-title" class="modal__title">QR Code</h3>
        <button class="modal__close" type="button" aria-label="Close">
          <i class="fa-solid fa-times" aria-hidden="true"></i>
        </button>
      </div>
      <div class="modal__body">
        <div class="qr-code-container">
          <img src="assets/MYQR.png" alt="" class="qr-code-image" width="200" height="200" loading="lazy" decoding="async">
        </div>
        <div class="qr-actions">
          <button class="qr-download-btn" type="button" aria-label="Download QR Code">
            <i class="fa-solid fa-download" aria-hidden="true"></i>
            <span>Download QR Code</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal video-modal" id="video-modal" role="dialog" aria-modal="true" aria-labelledby="video-modal-title" aria-describedby="video-modal-caption" aria-hidden="true" hidden>
    <div class="modal__backdrop" tabindex="-1" aria-hidden="true"></div>
    <div class="modal__content modal__content--video">
      <div class="modal__header modal__header--video">
        <div class="modal__header-text">
          <p class="modal__eyebrow" id="video-modal-eyebrow"></p>
          <h3 id="video-modal-title" class="modal__title"></h3>
          <p id="video-modal-caption" class="modal__caption"></p>
        </div>
        <button class="modal__close" type="button" aria-label="Close">
          <i class="fa-solid fa-times" aria-hidden="true"></i>
        </button>
      </div>
      <div class="modal__body">
        <div class="video-container">
          <div class="video-embed">
            <iframe
              id="profileVideoFrame"
              data-src="https://www.youtube.com/embed/2Ri8f-wqonE?playsinline=1&amp;rel=0&amp;modestbranding=1"
              title="YouTube video player"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
              loading="lazy">
            </iframe>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <aside class="install-banner" id="install-banner" hidden aria-live="polite">
    <div class="install-banner__head">
      <span class="install-banner__icon" aria-hidden="true">
        <i class="fa-solid fa-mobile-screen-button"></i>
      </span>
      <p class="install-banner__text" id="install-banner-text"></p>
    </div>
    <div class="install-banner__actions">
      <button type="button" class="install-banner__btn install-banner__btn--primary" id="install-accept"></button>
      <button type="button" class="install-banner__btn" id="install-dismiss"></button>
    </div>
  </aside>

  <script type="module" src="scripts/app.js?v=2"></script>
</body>
</html>
